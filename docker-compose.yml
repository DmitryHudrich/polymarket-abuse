# Runs both services. Locally: `docker compose up -d --build`.
# On the VPS the deploy workflow sets DETECTOR_IMAGE/BOT_IMAGE to pushed GHCR
# tags and runs `docker compose pull && up -d` (no build on the box).
# Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, any DETECTOR_* tuning) live in
# a `.env` file next to this compose file.

services:
  # Analytics store. Its own container and its own volume — the detector and the
  # bot stay stateless-ish and this can be stopped, wiped or moved to another box
  # without touching either. Nothing is exposed off-host.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${DETECTOR_CLICKHOUSE_DB:-arb}
      CLICKHOUSE_USER: ${DETECTOR_CLICKHOUSE_USER:-arb}
      CLICKHOUSE_PASSWORD: ${DETECTOR_CLICKHOUSE_PASSWORD:-arb}
      # Without this the bundled user cannot own the database it is given.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Mount the single override, NOT the whole config.d directory: the image
      # ships its own docker_related_config.xml in there, and that is what makes
      # the server listen beyond loopback. Replacing the directory leaves
      # ClickHouse reachable only from inside its own container.
      - ./clickhouse/config.d/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      # Published on loopback only, for ad-hoc SQL from the box itself:
      #   curl 'http://localhost:8123/?user=arb&password=arb' -d 'SELECT 1'
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  detector:
    image: ${DETECTOR_IMAGE:-polymarket-arb-detector:local}
    build:
      context: .
      args:
        BIN: detector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DETECTOR_BIND_ADDR: 0.0.0.0:8080
      DETECTOR_WATCH_FILE: /app/data/watchlist.json
      # Analytics. The detector retries the connection on its own, so it starts
      # whether or not ClickHouse is up yet — a slow store never delays alerts.
      DETECTOR_CLICKHOUSE_URL: ${DETECTOR_CLICKHOUSE_URL:-http://clickhouse:8123}
      DETECTOR_CLICKHOUSE_DB: ${DETECTOR_CLICKHOUSE_DB:-arb}
      DETECTOR_CLICKHOUSE_USER: ${DETECTOR_CLICKHOUSE_USER:-arb}
      DETECTOR_CLICKHOUSE_PASSWORD: ${DETECTOR_CLICKHOUSE_PASSWORD:-arb}
    volumes:
      - arb-data:/app/data
    depends_on:
      - clickhouse
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram-bot:
    image: ${BOT_IMAGE:-polymarket-arb-bot:local}
    build:
      context: .
      args:
        BIN: telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BACKEND_URL: http://detector:8080
      TELEGRAM_SETTINGS_FILE: /app/data/bot-settings.json
      TELEGRAM_ARCHIVE_FILE: /app/data/bot-archive.json
    volumes:
      - bot-data:/app/data
    depends_on:
      detector:
        condition: service_healthy

volumes:
  arb-data:
  bot-data:
  clickhouse-data:
